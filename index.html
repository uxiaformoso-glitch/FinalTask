<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Actividades</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav>
        <h3>Menú</h3>
        <ul>
            <li><a href="index.html">Listado de Actividades</a></li>
            <li><a href="createTask.html">Crear Tarea</a></li>
            <li><a href="categorias.html">Gestión de Categorías</a></li>
        </ul>
    </nav>
    
    <main>
        <h1>Listado de Actividades</h1>

        <div class="newTask">
            <button class="btn"><a href="createTask.html">Crear Nueva Tarea</a></button>
            <form id="importForm">    
                <div>
                    <input type="text" placeholder="Nombre del archivo" class="archiveName" id="jsonPath">
                    <button type="submit" class="btn">Subir</button>
                </div>
            </form>
        </div>
        

        <div class="containerTask">
            <h2>Tareas pendientes</h2>
            <div class="task" id="toDoTask"></div>
        </div>

        <div class="containerTask">
            <h2>Tareas acabadas</h2>
            <div class="task" id="finishedTask"></div>
        </div>

        <div class="statistics">
            <canvas class="taskChart" id="taskChart"></canvas>
        </div>
    </main>

    <script type="module" src="js/index.js"></script>
</body>
</html>
