<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Tarea</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <h3>Menú</h3>
        <ul>
            <li><a href="index.html">Listado de Actividades</a></li>
            <li><a href="createTask.html">Crear Tarea</a></li>
            <li><a href="categorias.html">Gestión de Categorías</a></li>
        </ul>
    </nav>

    <main>
        <h1>Crear Nueva Tarea</h1>

        <form class="form-container" id="taskForm">
            <div class="formField">
                <label for="title">Título:</label>
                <input type="text" id="title" required>
            </div>

            <div class="formField">
                <label for="description">Descripción:</label>
                <textarea name="description" id="description" required></textarea>
            </div>

            <div class="formField">
                <label for="date">Datos:</label>
                <input type="date" name="date" id="date" required>
            </div>

            <div class="formField">
                <label for="category">Categoría:</label>
                <select name="category" id="category" required>
                    <option value="" disabled selected>Selecciona una opción</option>
                </select>
            </div>

            <div class="formField">
                <label for="priority">Prioridad:</label>
                <select name="priority" id="priority" required>
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="Baja">Baja</option>
                    <option value="Media">Mediana</option>
                    <option value="Alta">Alta</option>
                </select>
            </div>

            <button type="submit" class="btn">Crear Tarea</button>
        </form>
    </main>

    <script type="module" src="js/formTask.js"></script>
</body>
</html>
